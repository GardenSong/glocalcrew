<style>

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.5}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.demo{max-width:440px;margin:0 auto;padding:12px 16px 6px;display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.demo select{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 6px;font-size:12px}
.phone{max-width:440px;margin:0 auto 28px;background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;min-height:620px;display:flex;flex-direction:column}
@media (max-width:480px){.phone{border-radius:0;border-left:0;border-right:0}}
.bar{position:sticky;top:0;z-index:5;background:var(--jade);color:var(--on-jade);padding:12px 18px}
.bar .ev{font-size:12px;opacity:.85}
.bar-top{display:flex;align-items:center;gap:8px}.bar-top .ev{flex:1}
.lang{border:1px solid rgba(255,255,255,.55);background:none;color:inherit;border-radius:999px;padding:3px 12px;font-size:12px;font-weight:500}
.bar .st{font-weight:600;font-size:17px}
.bar .sub{font-size:13px;opacity:.92}
.main{flex:1;padding:16px 18px 24px}
.tabs{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:var(--card);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{border:0;background:none;padding:10px 0 12px;font-size:13px;color:var(--muted)}
.tabs button[aria-current="page"]{color:var(--jade);font-weight:600}
h1{font-size:21px;font-weight:600;margin:2px 0 12px}
h2{font-size:15px;font-weight:600;margin:20px 0 8px}
.muted{color:var(--muted)}.small{font-size:13px}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.tl li:last-child{border-bottom:0}
.tl .t{font-weight:600;font-size:14px}
.tl .w{font-weight:500}
.tl .p{font-size:13px;color:var(--muted)}
.tl li.now{background:var(--jade-soft);margin:0 -10px;padding:10px;border-radius:12px;border-bottom-color:transparent}
.tl li.done .w,.tl li.done .t{color:var(--muted);font-weight:400}
.pill{display:inline-block;font-size:11px;font-weight:600;background:var(--jade);color:var(--on-jade);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:1px}
.act{display:inline-block;margin-top:6px;margin-right:12px;font-size:13px;color:var(--jade);font-weight:500;background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:14px}
.chip[aria-pressed="true"]{border-color:var(--jade);background:var(--jade-soft);color:var(--jade);font-weight:500}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px}
.grid label{display:flex;gap:8px;align-items:center;padding:7px 0;font-size:14px}
.grid input{width:18px;height:18px;accent-color:var(--jade)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:12px;font-weight:600;background:var(--jade);color:var(--on-jade);margin-top:16px;text-align:center;text-decoration:none}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink);font-weight:500}
.diet{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:12px;padding:10px 12px;font-size:13px}
.diet span{flex:1}
.link{background:none;border:0;padding:0;color:var(--jade);font-weight:500;text-decoration:underline;text-underline-offset:3px;font-size:13px}
.menu{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.menu .mn{font-weight:500}
.menu .ing{font-size:13px;color:var(--muted)}
.tag{display:inline-block;font-size:12px;border-radius:6px;padding:2px 8px;margin-top:4px;font-weight:500}
.t-can{background:var(--can-soft);color:var(--can)}.t-check{background:var(--check-soft);color:var(--check)}.t-no{background:var(--no-soft);color:var(--no)}
.sum{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 10px}
details summary{cursor:pointer;font-size:13px;font-weight:600;margin:12px 0 6px;list-style:none;color:var(--muted)}
details summary::before{content:"+ "}details[open] summary::before{content:"− "}
.place{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.place .n{font-weight:600}
.place .ko{color:var(--muted);font-weight:400;font-size:14px;margin-left:6px}
.place .meta{font-size:13px;color:var(--muted)}
.quiet{border:1px dashed var(--line);border-radius:14px;padding:14px;margin-top:22px}
.quiet h2{margin-top:0}
.note{font-size:12px;color:var(--muted);margin-top:12px}
.maps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
.mapbtn{display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-decoration:none;color:var(--ink);font-size:12px;font-weight:500;background:var(--card)}
.mapbtn .pin{width:22px;height:22px;color:var(--jade)}
.mapbtn .logo{width:26px;height:26px;object-fit:contain}
.toast{position:sticky;bottom:64px;margin:0 18px;background:var(--ink);color:var(--card);border-radius:10px;padding:10px 14px;font-size:13px;text-align:center}
.sample{font-size:11px;color:var(--muted);text-align:center;padding:0 16px 14px}

.map{height:260px;border-radius:14px;border:1.5px solid var(--soft);overflow:hidden;margin:0 0 8px;background:var(--soft);position:relative;z-index:0}
.map-note{font-size:12px;color:var(--muted);margin:0 0 14px}
.pin{display:flex;align-items:center;justify-content:center;border-radius:50%;font:700 12px/1 "Noto Sans KR",sans-serif;color:#fff;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.pin.can{background:#2F7D4A}.pin.check{background:#2E5AAC}
.pin.home{background:#C2571A;border-radius:10px;width:auto!important;padding:0 6px}
.pin.me{background:#1A73E8}
.num{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;margin-right:6px;vertical-align:2px}
.num.can{background:#2F7D4A}.num.check{background:#2E5AAC}
.leaflet-container{font-family:"Noto Sans KR",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .map .leaflet-tile{filter:invert(.92) hue-rotate(180deg) brightness(.95) contrast(.9)}}
:root[data-theme="dark"] .map .leaflet-tile{filter:invert(.92) hue-rotate(180deg) brightness(.95) contrast(.9)}

.map-me{background:var(--card);color:var(--ink);border:1.5px solid var(--soft);border-radius:999px;padding:6px 12px;font:700 13px "Noto Sans KR",sans-serif;box-shadow:0 1px 4px rgba(0,0,0,.25);cursor:pointer}
.route-info{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;background:var(--jade-soft);border-radius:12px;padding:9px 12px;font-size:14px;margin:0 0 8px}
.route-info[hidden]{display:none}
.pop{min-width:180px;font-family:"Noto Sans KR",sans-serif}
.pop-n{font-weight:700;font-size:15px}.pop-m{font-size:13px;color:#6E5E50;margin:2px 0 4px}
.pop-b{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.pop-b button{border:0;border-radius:8px;padding:7px 0;font:700 13px "Noto Sans KR",sans-serif;background:#C2571A;color:#fff;cursor:pointer}
.pop-b button.ghost{background:#fff;color:#2A211A;border:1.5px solid #E5DACB}
.leaflet-popup-content-wrapper{border-radius:14px}
</style>

function walkMin(a,b){const R=6371000,r=x=>x*Math.PI/180;const dLa=r(b.lat-a.lat),dLo=r(b.lng-a.lng);const h=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2;return Math.max(1,Math.round(2*R*Math.asin(Math.sqrt(h))*1.3/75))}

 <div class="quiet"><h2>${t("quietT")}</h2><p class="small muted" style="margin:0">${t("quietD")}</p><button class="btn" id="tell">${t("tell")}</button></div>`}

let NEAR=[];
const MT={showMe:["Show me","내 위치"],route:["Route","길 보기"],details:["Details","자세히"],info:["{m} min walk · {d} m {f}","{f} 도보 {m}분 · {d}m"],fromYou:["from you","내 위치에서"],fromHostel:["from the hostel","호스텔에서"],fail:["Couldn't load the walking route here, so a straight line is shown.","여기서는 걸어가는 길을 불러오지 못해 직선으로 보여드려요."],clear:["Clear","지우기"],follow:["Following your location","내 위치를 따라가는 중"]};
const mt=k=>MT[k][S.lang==="ko"?1:0];
let MAP={m:null,me:null,line:null,watch:null,first:true,routeTo:null,lastRoute:null};
const near=()=>S.loc&&walkMin(S.loc,HOSTEL)<=30;
function stopWatch(){if(MAP.watch!==null){navigator.geolocation.clearWatch(MAP.watch);MAP.watch=null}}
function startWatch(){if(!navigator.geolocation){S.locState=lt("none");return render()}
 if(MAP.watch!==null)return;MAP.first=true;S.locState=lt("finding");const n=document.getElementById("map-note");if(n)n.textContent=lt("finding");
 MAP.watch=navigator.geolocation.watchPosition(pos=>{const had=!!S.loc;S.loc={lat:pos.coords.latitude,lng:pos.coords.longitude};S.locState="";
   if(!had){render();return}
   updateMe();
   if(MAP.routeTo!==null&&MAP.lastRoute&&walkMin(MAP.lastRoute,S.loc)>=1)drawRoute(MAP.routeTo,true)},
  err=>{S.locState=err.code===1?lt("off"):lt("fail");stopWatch();render()},{enableHighAccuracy:true,maximumAge:10000,timeout:15000})}
function updateMe(){const LF=window.L,m=MAP.m;if(!LF||!m||!S.loc)return;
 if(MAP.me)MAP.me.setLatLng([S.loc.lat,S.loc.lng]);else MAP.me=LF.marker([S.loc.lat,S.loc.lng],{icon:LF.divIcon({className:"",html:'<div class="pin me" style="width:18px;height:18px"></div>',iconSize:[18,18],iconAnchor:[9,9]}),title:"You",zIndexOffset:1000}).addTo(m);
 if(MAP.first&&near()){m.setView([S.loc.lat,S.loc.lng],17);MAP.first=false}
 const n=document.getElementById("map-note");if(n&&near())n.textContent=mt("follow")}
async function drawRoute(i,quiet){const LF=window.L,m=MAP.m;if(!LF||!m)return;const x=NEAR[i];if(!x)return;MAP.routeTo=i;
 const from=near()?S.loc:HOSTEL;MAP.lastRoute=near()?{...S.loc}:null;const f=near()?mt("fromYou"):mt("fromHostel");
 const info=document.getElementById("route-info");let pts,mins,dist,ok=true;
 try{const r=await fetch(`https://routing.openstreetmap.de/routed-foot/route/v1/driving/${from.lng},${from.lat};${x.p.lng},${x.p.lat}?overview=full&geometries=geojson`);const j=await r.json();const rt=j.routes[0];pts=rt.geometry.coordinates.map(c=>[c[1],c[0]]);mins=Math.max(1,Math.round(rt.duration/60));dist=Math.round(rt.distance)}
 catch(e){ok=false;pts=[[from.lat,from.lng],[x.p.lat,x.p.lng]];mins=walkMin(from,x.p);dist=Math.round(mins*75/1.3)}
 if(MAP.m!==m)return;if(MAP.line)MAP.line.remove();
 MAP.line=LF.polyline(pts,{color:getComputedStyle(document.documentElement).getPropertyValue("--jade").trim()||"#C2571A",weight:5,opacity:.9,dashArray:ok?null:"6 8"}).addTo(m);
 if(!quiet)m.fitBounds(MAP.line.getBounds(),{padding:[40,40],maxZoom:18});
 if(info){info.hidden=false;info.innerHTML=`<span><b>${nm(x.p)}</b> · ${MT.info[S.lang==="ko"?1:0].replace("{m}",mins).replace("{d}",dist).replace("{f}",f)}${ok?"":"<br>"+mt("fail")}</span><button class="link" id="route-clear">${mt("clear")}</button>`}}
function clearRoute(){if(MAP.line){MAP.line.remove();MAP.line=null}MAP.routeTo=null;const info=document.getElementById("route-info");if(info)info.hidden=true}
function initMap(){const el=document.getElementById("map");if(!el)return;MAP.me=null;MAP.line=null;
 if(!window.L){el.style.display="none";document.getElementById("map-note").textContent=t("mapOff");return}
 const LF=window.L;const start=near()?[S.loc.lat,S.loc.lng]:[HOSTEL.lat,HOSTEL.lng];
 const m=LF.map(el,{zoomControl:true,attributionControl:true,scrollWheelZoom:false,zoomAnimation:false,fadeAnimation:false,markerZoomAnimation:false}).setView(start,near()?17:16);MAP.m=m;window._map=m;
 let failed=0;const tl=LF.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap"}).addTo(m);
 tl.on("tileerror",()=>{if(++failed===3){document.getElementById("map-note").textContent=t("mapOff")}});
 const Me=LF.Control.extend({onAdd(){const b=LF.DomUtil.create("button","map-me");b.type="button";b.textContent=mt("showMe");b.setAttribute("aria-label",mt("showMe"));LF.DomEvent.disableClickPropagation(b);b.addEventListener("click",()=>{if(S.loc&&near()){m.setView([S.loc.lat,S.loc.lng],17)}startWatch()});return b}});
 new Me({position:"topright"}).addTo(m);
 const pts=[[HOSTEL.lat,HOSTEL.lng]];
 LF.marker([HOSTEL.lat,HOSTEL.lng],{icon:LF.divIcon({className:"",html:`<div class="pin home" style="height:26px">${t("hostelPin")}</div>`,iconSize:[60,26],iconAnchor:[30,13]}),title:t("hostelPin"),keyboard:true}).addTo(m);
 NEAR.forEach((x,i)=>{const k=x.c.can?"can":"check";
  const walk=L()?t("walk")+x.p.walk+t("min"):x.p.walk+t("walk");
  const pop=`<div class="pop"><div class="pop-n">${nm(x.p)}</div><div class="pop-m">${walk}${fromYou(x.p)}</div><div>${x.c.can?`<span class="tag t-can">${count(x.c.can,"canN")}</span> `:""}${x.c.check?`<span class="tag t-check">${count(x.c.check,"checkN")}</span>`:""}</div><div class="pop-b"><button type="button" data-r="${i}">${mt("route")}</button><button type="button" class="ghost" data-c="${i}">${mt("details")}</button></div></div>`;
  LF.marker([x.p.lat,x.p.lng],{icon:LF.divIcon({className:"",html:`<div class="pin ${k}" style="width:28px;height:28px">${i+1}</div>`,iconSize:[28,28],iconAnchor:[14,14]}),title:nm(x.p),keyboard:true}).addTo(m).bindPopup(pop,{maxWidth:240,closeButton:true,autoPanPaddingTopLeft:[56,16],autoPanPaddingBottomRight:[16,16]});
  pts.push([x.p.lat,x.p.lng])});
 m.on("popupopen",e=>{const pe=e.popup.getElement();pe.querySelectorAll("[data-r]").forEach(b=>b.addEventListener("click",()=>{m.closePopup();drawRoute(+b.dataset.r)}));pe.querySelectorAll("[data-c]").forEach(b=>b.addEventListener("click",()=>{const c=document.getElementById("place-"+b.dataset.c);if(c)c.scrollIntoView({behavior:"smooth",block:"center"})}))});
 if(near()){updateMe();MAP.first=false}else if(pts.length>1)m.fitBounds(pts,{padding:[30,30],maxZoom:17});
 if(MAP.routeTo!==null)drawRoute(MAP.routeTo,true);
 if(MAP.watch===null&&navigator.permissions&&navigator.geolocation){navigator.permissions.query({name:"geolocation"}).then(r=>{if(r.state==="granted")startWatch()}).catch(()=>{})}}
function nearby(){const ps=NEAR=PLACES.filter(p=>p.verified||PREVIEW).map(p=>{const c={can:0,check:0};p.menus.forEach(m=>{const j=judge(m);if(j!=="no")c[j]++});return{p,c}}).filter(x=>x.c.can||x.c.check).sort((a,b)=>(b.c.can>0)-(a.c.can>0)||a.p.walk-b.p.walk);
 const walkTxt=w=>L()?t("walk")+w+t("min"):w+t("walk");
 return `<h1>${t("near")}</h1><p class="small muted" style="margin-top:-6px">${t("nearD")}</p>${locRow()}<div id="map" class="map" aria-label="Map of the hostel and nearby places"></div><div id="route-info" class="route-info" hidden></div><p class="map-note" id="map-note">${t("mapNote")}</p>
 ${ps.map((x,i)=>`<div class="place" id="place-${i}"><div class="n"><span class="num ${x.c.can?"can":"check"}">${i+1}</span>${nm(x.p)}<span class="ko">${nm2(x.p)}</span></div><div class="meta">${walkTxt(x.p.walk)}${fromYou(x.p)}${t("open")}${x.p.close}</div>
  ${x.c.can?`<span class="tag t-can">${count(x.c.can,"canN")}</span> `:""}${x.c.check?`<span class="tag t-check">${count(x.c.check,"checkN")}</span>`:""}
  <div>${dirLinks(x.p,x.p.ko)}</div></div>`).join("")||`<div class="info"><div class="p">${PLACES.some(p=>p.verified)?t("nomatch"):t("notChecked")}</div><a class="act" ${KAKAO_URL?`target="_blank" rel="noopener" href="${KAKAO_URL}"`:`href="sms:01064688558"`}>${t("askBtn")}</a></div>`}
 ${PREVIEW?`<p class="note">${t("sampleNear")}</p>`:""}`}

function render(){const app=document.getElementById("app");
 document.documentElement.lang=L()?"ko":"en";
 document.getElementById("clock-l").textContent=t("preview");document.querySelector('#clock option[value="live"]').textContent=t("live");
 document.getElementById("sample").textContent=PREVIEW?t("sample"):"";document.querySelector(".demo").style.display=PREVIEW?"":"none";if(!PREVIEW)S.clock="live";
 const body={today,food,nearby}[S.tab]();
 const tabs=["today","food","nearby"].map((k,i)=>`<button data-tab="${k}" ${S.tab===k?'aria-current="page"':""}>${T.tabs[L()][i]}</button>`).join("");
 if(window._map){try{window._map.off();window._map.remove()}catch(e){}window._map=null;MAP.m=null}
 app.innerHTML=bar()+`<div class="main">${body}</div>`+(S.toast?`<div class="toast" role="status">${esc(S.toast)}</div>`:"")+`<nav class="tabs" aria-label="Sections">${tabs}</nav>`;
 if(S.tab==="nearby")initMap();else{stopWatch();MAP.m=null}}

document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
 if(b.id==="lang"){S.lang=S.lang==="en"?"ko":"en";try{localStorage.setItem("gc-lang",S.lang)}catch(err){}return render()}
 if(b.dataset.tab){S.tab=b.dataset.tab;render();return window.scrollTo(0,0)}
 if(b.dataset.goto){S.tab=b.dataset.goto;render();const id=b.dataset.meal&&document.getElementById("meal-"+b.dataset.meal);if(id&&S.diet&&!S.editing)id.scrollIntoView();else window.scrollTo(0,0);return}
 if(b.dataset.preset){const k=b.dataset.preset;if(S.presets.has(k)){S.presets.delete(k);PRESET[k].forEach(i=>{if(![...S.presets].some(q=>PRESET[q].includes(i)))S.avoid.delete(i)})}else{const cover=[...S.presets].find(q=>PRESET[k].every(i=>PRESET[q].includes(i)));if(cover)return toast(t("included")+pname(cover));[...S.presets].forEach(q=>{if(PRESET[q].every(i=>PRESET[k].includes(i)))S.presets.delete(q)});S.presets.add(k);PRESET[k].forEach(i=>S.avoid.add(i))}return render()}
 if(b.id==="save"){if(!S.avoid.size)return toast(t("pick"));S.diet=true;S.editing=false;save();return render()}
 if(b.id==="any"){S.avoid.clear();S.presets.clear();S.diet=true;S.editing=false;save();return render()}
 if(b.id==="edit"){S.editing=true;return render()}
 if(b.id==="route-clear"){clearRoute();return}
 if(b.id==="survey"){if(SURVEY_URL){window.open(SURVEY_URL,"_blank","noopener");return}return toast(t("surveySoon"))}
 if(b.id==="loc"&&S.tab==="nearby"){startWatch();return}
 if(b.id==="loc"){if(!navigator.geolocation){S.locState=lt("none");return render()}S.locState=lt("finding");render();navigator.geolocation.getCurrentPosition(pos=>{S.loc={lat:pos.coords.latitude,lng:pos.coords.longitude};S.locState="";render()},err=>{S.locState=err.code===1?lt("off"):lt("fail");render()},{enableHighAccuracy:true,timeout:10000,maximumAge:60000});return}
 if(b.id==="tell"){if(FORM_URL){window.open(FORM_URL,"_blank","noopener");return}return toast(t("formSoon"))}
});
document.addEventListener("change",e=>{const el=e.target;
 if(el.id==="clock"){S.clock=el.value;return render()}
 if(el.dataset.ing){el.checked?S.avoid.add(el.dataset.ing):S.avoid.delete(el.dataset.ing);S.presets=new Set([...S.presets].filter(k=>PRESET[k].every(i=>S.avoid.has(i))))}
});
document.addEventListener("click",e=>{const a=e.target.closest("a.naver");if(!a)return;const fb=a.dataset.fallback;const t0=Date.now();setTimeout(()=>{if(!document.hidden&&Date.now()-t0<2500)window.open(fb,"_blank","noopener")},1500)});
setInterval(()=>{if(S.clock==="live"&&S.tab==="today")render()},30000);
render();
</script>
